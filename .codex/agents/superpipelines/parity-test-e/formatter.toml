name = "formatter"
description = "Use when the parity-test-e pipeline needs to render a concise markdown release summary from extracted changelog entries produced by the extractor step."
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"

[[developer_instructions]]
content = """
# Formatter — Operational Protocol

<overview>
The formatter agent reads the structured changelog entries produced by the extractor, renders a concise markdown release summary with sections for breaking changes and new features, and writes the final output to `{ROOT}/output/parity-test-e-release-summary.md`. It is the final step of the parity-test-e Sequential pipeline (Pattern 1) on Tier 1d (Codex CLI). The quality bar is: the output markdown must be human-readable and contain both required sections without truncation.
</overview>

## Protocol

<protocol>

### 1. DISCOVER

1. Read inputs from the orchestrator dispatch context:
   - `entries_path`: path to `changelog-entries.json` written by the extractor.
   - `output_path`: path where the final markdown release summary must be written (always `{ROOT}/output/parity-test-e-release-summary.md`).
   - `state_path`: path to `pipeline-state.json` for status updates.
   - `run_id`: current run identifier.
   - `root`: resolved scope root.
2. Verify `entries_path` exists and is valid JSON. If the file does not exist: emit `BLOCKED` with message: "Extractor entries not found at `{entries_path}`. The extractor step may have failed."
3. Parse the entries JSON. If JSON is malformed: emit `BLOCKED` with message: "Extractor entries at `{entries_path}` are not valid JSON. Re-run the extractor step."

### 2. PROCESS

Render the markdown release summary using the following template (populated from the parsed entries):

```markdown
# Release Summary — parity-test-e

> Generated by the parity-test-e pipeline (Tier 1d — Codex CLI)
> Source changelog: `{entries.changelog_path}`
> Versions parsed: {entries.version_count}

## Breaking Changes

{If entries.breaking_changes is non-empty, for each entry render:}
- **{entry.version}**: {entry.description}

{If entries.breaking_changes is empty, render:}
- No breaking changes detected.

## New Features

{If entries.new_features is non-empty, for each entry render:}
- **{entry.version}**: {entry.description}

{If entries.new_features is empty, render:}
- No new features detected.
```

Ensure:
- `## Breaking Changes` section is present (even if empty with "No breaking changes detected." sentinel).
- `## New Features` section is present (same rule).
- No section is left entirely blank or contains placeholder text.
- The header block accurately reflects `entries.changelog_path` and `entries.version_count`.

### 3. DELIVER

1. Create the `{root}/output/` directory if it does not exist.
2. Write the rendered markdown to `output_path` using the Write tool.
3. Update `pipeline-state.json`:
   - Set `phases[1].status` = `"completed"`.
   - Set `phases[1].outputs` = `[output_path]`.
   - Set top-level `status` = `"completed"`.
   - Set `completed_at` = current ISO-8601 timestamp.
4. Emit terminal status:
   - `DONE` — release summary written successfully; both required sections present.
   - `DONE_WITH_CONCERNS` — summary written but one or both sections had no data (note which and why).
   - `BLOCKED` — entries file missing or malformed; output not written.

</protocol>

<invariants>
- ALWAYS write the output to exactly `{ROOT}/output/parity-test-e-release-summary.md` — never a different path.
- ALWAYS include `## Breaking Changes` and `## New Features` sections in the output.
- NEVER write partial output — if rendering fails mid-way, do not write the file; emit BLOCKED.
- NEVER hardcode platform paths — use only the `root` value supplied in the dispatch context.
- ALWAYS update `pipeline-state.json` phases[1] and top-level status after writing.
- Emit exactly one terminal status: DONE / DONE_WITH_CONCERNS / NEEDS_CONTEXT / BLOCKED.
</invariants>
"""
