name: Profile Drift Review

# Platform capability facts live in skills/sk-platform-dispatch/profiles/*.json and
# rot silently as hosts evolve (spec GAP-10 — e.g. tier_1 said Claude Code had no
# effort field months after it shipped one). Monthly, open a checklist issue so a
# maintainer or agent re-verifies each profile against the platforms' current docs.

on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect profile versions
        id: profiles
        run: |
          {
            echo 'table<<EOF'
            echo '| Profile | model_tiers_version | profile_version |'
            echo '| :--- | :--- | :--- |'
            for f in skills/sk-platform-dispatch/profiles/tier_*.json; do
              name=$(python3 -c "import json;print(json.load(open('$f'))['name'])")
              mtv=$(python3 -c "import json;print(json.load(open('$f'))['model_tiers_version'])")
              pv=$(python3 -c "import json;print(json.load(open('$f'))['profile_version'])")
              echo "| $name (\`$(basename $f)\`) | $mtv | $pv |"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Open the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          existing=$(gh issue list --state open --search "in:title \"Profile drift review — $month\"" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Review issue for $month already open; skipping."
            exit 0
          fi
          gh issue create \
            --title "Profile drift review — $month" \
            --label "needs-triage" \
            --body "$(cat <<BODY
          > *This was generated by AI during triage.*

          Monthly re-verification of the platform profiles against current official documentation (\`docs/plans/fix-plan-2026-07.md\` WI-10 / spec GAP-10).

          ${{ steps.profiles.outputs.table }}

          ## Checklist

          - [ ] **Claude Code** — subagent frontmatter field list still matches what \`TRANSLATE_CAD_TO_CC\` emits (\`tools\`, \`disallowedTools\`, \`permissionMode\`, \`maxTurns\`, \`skills\`, \`effort\`, \`isolation\`); plugin-scope restrictions (BUNDLE-08) unchanged; plugin CLI verbs (\`claude plugin marketplace add\` / \`plugin install\`) unchanged.
          - [ ] **Codex** — agent TOML keys (\`name\`, \`model\`, \`model_reasoning_effort\`, \`sandbox_mode\`, \`turn_limit\`, \`instructions\` vs \`developer_instructions\`) still parse; plugin verbs unchanged; skills discovery paths unchanged.
          - [ ] **OpenCode** — \`mode: subagent\` frontmatter, \`permission: { edit: deny }\`, \`reasoningEffort\` provider gating unchanged.
          - [ ] **Copilot CLI** — (once tier_1e lands) \`.agent.md\` frontmatter and \`tools\` allowlist enforcement unchanged.
          - [ ] **Model catalogs** — each profile's \`model_tiers\` matches the platform's current model lineup; \`model_tiers_version\` older than 90 days is a finding by itself.
          - [ ] Run \`npm run check:all\` after any profile edit; bump \`model_tiers_version\` on catalog changes.

          Close with a comment stating either "no drift" per platform or linking the fix PRs.
          BODY
          )"
